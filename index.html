<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dust Strike — three.js Tactical FPS</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #222; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 2px #000; }
    #hud .hidden { display: none; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0f0; }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
    #topbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; font-size: 20px; font-weight: bold; }
    #score-ct { color: #6cb2ff; } #score-t { color: #ffd66c; }
    #timer { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: bold; }
    #announce { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: bold; text-align: center; }
    #killfeed { position: absolute; top: 12px; right: 12px; text-align: right; font-size: 15px; }
    #killfeed div { background: rgba(0,0,0,.45); padding: 2px 8px; margin-bottom: 4px; border-radius: 3px; }
    #bottombar { position: absolute; bottom: 14px; left: 14px; right: 14px; display: flex; gap: 24px; font-size: 22px; font-weight: bold; align-items: flex-end; }
    #money { color: #7fd67f; margin-left: auto; }
    #armor { font-size: 18px; }
    #buymenu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10,14,20,.92); border: 1px solid #567; border-radius: 8px; padding: 18px 28px; pointer-events: none; min-width: 320px; }
    #buymenu h2 { margin: 0 0 12px; font-size: 20px; }
    #buymenu div { padding: 6px 4px; font-size: 17px; }
    #scoreboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10,14,20,.92); border: 1px solid #567; border-radius: 8px; padding: 16px 24px; min-width: 380px; }
    #scoreboard h2 { margin: 0 0 10px; font-size: 18px; }
    #scoreboard div { padding: 2px 0; font-size: 15px; }
    #scoreboard .ct { color: #6cb2ff; } #scoreboard .t { color: #ffd66c; }
    #scoreboard .dead { opacity: .45; }
    #fps-hint { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .7; }
    #nogl { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 20px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
